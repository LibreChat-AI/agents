name: Workflow Syntax

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/**'
      - 'config/workflow-syntax.test.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'config/workflow-syntax.test.mjs'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: node --test config/workflow-syntax.test.mjs
